name: Build container
on:
  push:
    branches: [main, hfx-gateway]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck server
        working-directory: server
        run: npm ci && npm run typecheck
      - name: Check gateway syntax
        run: python3 -m py_compile gateway/app.py
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish commit image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/jordan1o97/bigcapital-mcp:${{ github.sha }}
